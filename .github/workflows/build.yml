name: build
on:
  workflow_dispatch:
    inputs:
      validation:
        description: Validation suite
        type: choice
        default: unit
        options:
        - unit
        - live
permissions:
  contents: read
jobs:
  validate:
    if: ${{ inputs.validation != 'live' }}
    name: Validate stale-path cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: 67d0e8b72b5d69476af3afc4c892195be80aa4d0
        fetch-depth: 2

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Check formatting, build, and vet
      run: |
        test -z "$(gofmt -l pkg/spdk/enginefrontend.go pkg/spdk/switchover_test.go pkg/spdk/nvme_path_cleanup.go pkg/spdk/nvme_path_cleanup_test.go)"
        git diff --check
        go build ./...
        go vet ./...

    - name: Run full race-enabled Go suite
      run: go test -race ./... -count=1 -timeout=10m

    - name: Stress cleanup regressions
      run: |
        go test -race ./pkg/spdk -count=25 -timeout=10m -args -check.f 'EngineFrontendCleanup|NvmeTCPPath|DropSupersededNvmeTCPPath|BlockdevDropsSupersededPath|BlockdevDropFailure'

    - name: Compile Linux ARM64 tests
      run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/spdk-arm64.test" ./pkg/spdk

    - name: Run repository linter
      run: |
        docker run --rm -v "$PWD":/app:ro -w /app golangci/golangci-lint:v2.13.2@sha256:ba07dffad130794ae79ebaa0056809d18c0168f3f846480ffd3eb6c04578b83d golangci-lint run --timeout=10m

    - name: Verify new tests reject unsafe cleanup
      run: |
        sed -i 's/if persistErr == nil {/if true {/' pkg/spdk/enginefrontend.go
        sed -i '/if err := ef.waitForNvmeTCPPathOptimized/s/err != nil/false/' pkg/spdk/enginefrontend.go
        sed -i 's/helperutil.IsSameNvmeAddr(oldTargetIP, newTargetIP)/oldTargetIP == newTargetIP/' pkg/spdk/enginefrontend.go
        set +e
        go test -race ./pkg/spdk -count=1 -timeout=5m -args -check.f 'EngineFrontendCleanupSkipsAfterPersistenceFailure|EngineFrontendCleanupSkipsUnoptimizedReplacement|DropSupersededNvmeTCPPathPreservesEquivalentAddress' 2>&1 | tee "$RUNNER_TEMP/stale-path-without-guards.log"
        regression_status=${PIPESTATUS[0]}
        set -e
        test "$regression_status" -ne 0
        grep -F '3 FAILED' "$RUNNER_TEMP/stale-path-without-guards.log"

  live:
    if: ${{ inputs.validation == 'live' }}
    name: Isolated kernel NVMe-TCP continuous-I/O validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout CI fixture and exact source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 10

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Verify source and compile fixture
      run: |
        git diff --check
        git diff --exit-code 67d0e8b72b5d69476af3afc4c892195be80aa4d0 -- . ':(exclude).github/workflows/build.yml' ':(exclude)pkg/spdk/stale_path_live_test.go'
        go test -tags stale_path_integration -c -o "$RUNNER_TEMP/stale-path-live.test" ./pkg/spdk

    - name: Prepare disposable loopback NVMe-TCP target
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends nvme-cli fio kmod
        if ! modinfo nvmet-tcp >/dev/null 2>&1; then
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
        fi
        sudo modprobe nvme-tcp
        sudo modprobe nvmet-tcp
        mountpoint -q /sys/kernel/config || sudo mount -t configfs none /sys/kernel/config
        test "$(cat /sys/module/nvme_core/parameters/multipath)" = Y
        nvme version

    - name: Exercise both handoffs and disconnect-failure fallback with verified I/O
      run: |
        sudo "$RUNNER_TEMP/stale-path-live.test" -test.run '^TestStalePathLiveSwitchover$' -test.v -test.timeout=5m
